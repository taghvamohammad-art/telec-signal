<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#151a2e">
<title>ورود به تلک</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="login">
  <form id="f" novalidate>
    <div class="brand"><b>تلک</b><span>سیگنال کریپتو</span></div>
    <label>نام کاربری
      <input class="field" name="username" autocomplete="username" required autofocus>
    </label>
    <label>رمز عبور
      <input class="field" name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn" type="submit">ورود</button>
    <p class="form-error" id="err" role="alert"></p>
  </form>
</main>
<script src="/static/login.js"></script>
</body>
</html>
